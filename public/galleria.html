<!DOCTYPE html>
<!-- ⬇️ GALLERIA LIVE (galleria.html) — v6.5 -->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galleria dell'evento</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; font-family: 'Sora', system-ui, sans-serif; }
  body { margin: 0; background: #0b1020; color: #fff;
    background-image: radial-gradient(60% 45% at 15% 0%, rgba(124,58,237,.30), transparent 60%),
      radial-gradient(50% 40% at 90% 10%, rgba(236,72,153,.20), transparent 60%);
    background-attachment: fixed; }
  header { text-align: center; padding: 1.2rem .5rem .3rem; }
  header h1 { margin: 0; font-size: 1.4rem; font-weight: 800;
    background: linear-gradient(90deg, #a78bfa, #f472b6);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  header p { margin: .2rem 0 0; color: #e94560; font-weight: 600; }
  #conteggio { text-align: center; color: #94a3b8; margin: .4rem 0 .8rem; }
  #griglia { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 6px; padding: 0 6px 24px; max-width: 1200px; margin: 0 auto; }
  .cella { position: relative; border-radius: 10px; overflow: hidden; cursor: zoom-in;
    background: rgba(255,255,255,.06); }
  .cella img, .cella video { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  .cella .icona-video { position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; font-size: 2rem; pointer-events: none;
    text-shadow: 0 2px 10px rgba(0,0,0,.7); }
  #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.95);
    z-index: 50; flex-direction: column; align-items: center; justify-content: center; }
  #contenuto img, #contenuto video { max-width: 100%; max-height: 82vh; object-fit: contain; }
  #info { margin-top: .6rem; color: #ccc; font-size: .95rem; text-align: center; }
  #info a { color: #7dd3fc; }
  .nav { position: fixed; top: 50%; transform: translateY(-50%); font-size: 2.4rem;
    background: none; border: none; color: #fff; cursor: pointer; padding: 1rem; z-index: 51; }
  #prec { left: 2px; }  #succ { right: 2px; }
  #chiudi { position: fixed; top: 10px; right: 14px; font-size: 1.7rem; background: none;
    border: none; color: #fff; cursor: pointer; z-index: 51; }
  .tag-versione { text-align: center; padding-bottom: 1rem; font-size: .7rem; color: #475569; }
</style>
</head>
<body>
<header>
  <h1>🖼️ Galleria live</h1>
  <p id="nome-evento">…</p>
</header>
<p id="conteggio"></p>
<div id="griglia"></div>
<p class="tag-versione">galleria · v6.5</p>

<div id="lightbox" onclick="chiudi()">
  <button id="chiudi">✕</button>
  <button class="nav" id="prec" onclick="event.stopPropagation(); naviga(-1)">‹</button>
  <div id="contenuto" onclick="event.stopPropagation()"></div>
  <div id="info" onclick="event.stopPropagation()"></div>
  <button class="nav" id="succ" onclick="event.stopPropagation(); naviga(1)">›</button>
</div>

<script>
const token = location.pathname.split('/')[2];
let media = [], indice = 0, ultimoNumero = -1;

fetch('/api/evento/' + token).then(r => r.ok ? r.json() : null)
  .then(d => document.getElementById('nome-evento').textContent = d ? d.nome : '');

async function aggiorna() {
  try {
    media = await (await fetch('/api/foto/' + token)).json();
    if (media.length !== ultimoNumero) { ultimoNumero = media.length; disegna(); }
    const nf = media.filter(m => m.tipo !== 'video').length;
    const nv = media.length - nf;
    document.getElementById('conteggio').textContent = media.length
      ? `${nf} foto e ${nv} video condivisi 🎉`
      : 'Nessun contenuto ancora… aspetta i primi scatti!';
  } catch (e) {}
}

function disegna() {
  const g = document.getElementById('griglia');
  g.innerHTML = '';
  media.forEach((m, i) => {
    const cella = document.createElement('div');
    cella.className = 'cella';
    cella.onclick = () => apri(i);
    if (m.tipo === 'video') {
      const ic = document.createElement('span');
      ic.className = 'icona-video'; ic.textContent = '▶️';
      const img = document.createElement('img');
      img.alt = ''; img.loading = 'lazy';
      img.src = m.url + '.jpg'; // anteprima generata dal server
      img.onerror = () => {
        img.remove();
        const v = document.createElement('video');
        v.src = m.url + '#t=0.1';
        v.preload = 'metadata'; v.muted = true; v.playsInline = true;
        cella.insertBefore(v, ic);
      };
      cella.append(img, ic);
    } else {
      const img = document.createElement('img');
      img.src = m.url; img.loading = 'lazy';
      cella.append(img);
    }
    g.append(cella);
  });
}

function apri(i) { indice = i; mostra(); document.getElementById('lightbox').style.display = 'flex'; }
function chiudi() {
  document.getElementById('lightbox').style.display = 'none';
  document.getElementById('contenuto').innerHTML = '';
}
function mostra() {
  const m = media[indice];
  const box = document.getElementById('contenuto');
  if (m.tipo === 'video') {
    box.innerHTML = `<video src="${m.url}" controls autoplay playsinline></video>`;
    const v = box.querySelector('video');
    v.onerror = () => {
      box.innerHTML = '<p style="color:#fca5a5;text-align:center;padding:1rem">⚠️ Questo video non è riproducibile nel browser.<br>Usa «scarica» qui sotto o attendi la conversione.</p>';
    };
  } else {
    box.innerHTML = `<img src="${m.url}">`;
  }
  let quando = '';
  try { quando = new Date(m.caricata_il.replace(' ', 'T') + 'Z').toLocaleString('it-IT'); } catch (e) {}
  const info = document.getElementById('info');
  info.textContent = `${m.tipo === 'video' ? '🎬' : '📸'} ${m.invitato || 'Invitato'} • ${quando}`;
  if (m.tipo === 'video') {
    const a = document.createElement('a');
    a.href = m.url;
    a.download = 'video-' + (indice + 1) + '.mp4';
    a.textContent = '⬇️ scarica';
    info.append(' • ', a);
  }
}
function naviga(d) {
  if (!media.length) return;
  indice = (indice + d + media.length) % media.length;
  mostra();
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') chiudi();
  if (e.key === 'ArrowLeft') naviga(-1);
  if (e.key === 'ArrowRight') naviga(1);
});

aggiorna();
setInterval(aggiorna, 5000);
</script>
</body>
</html>
