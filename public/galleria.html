<!DOCTYPE html>
<!-- ⬇️ GALLERIA LIVE (galleria.html) -->
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galleria dell'evento</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; font-family: 'Sora', system-ui, sans-serif; }
  body { margin: 0; background: #0b1020; color: #fff;
    background-image: radial-gradient(60% 45% at 15% 0%, rgba(124,58,237,.30), transparent 60%),
      radial-gradient(50% 40% at 90% 10%, rgba(236,72,153,.20), transparent 60%);
    background-attachment: fixed; }
  header { text-align: center; padding: 1.2rem .5rem .3rem; }
  header h1 { margin: 0; font-size: 1.4rem; font-weight: 800;
    background: linear-gradient(90deg, #a78bfa, #f472b6);
    -webkit-background-clip: text; background-clip: text; color: transparent; }
  header p { margin: .2rem 0 0; color: #e94560; font-weight: 600; }
  #conteggio { text-align: center; color: #94a3b8; margin: .4rem 0 .8rem; }
  #griglia { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 6px; padding: 0 6px 24px; max-width: 1200px; margin: 0 auto; }
  .cella { position: relative; }
  .cella img, .cella video { width: 100%; aspect-ratio: 1; object-fit: cover;
    border-radius: 10px; cursor: zoom-in; background: rgba(255,255,255,.06); display: block; }
  .cella .play { position: absolute; inset: 0; display: flex; align-items: center;
    justify-content: center; font-size: 2.2rem; color: #fff; pointer-events: none;
    text-shadow: 0 2px 10px #000; }
  .cella .badge-v { position: absolute; top: 6px; left: 6px; font-size: .75rem;
    background: rgba(0,0,0,.6); padding: .1rem .45rem; border-radius: 99px; pointer-events: none; }
  #lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.95);
    z-index: 50; flex-direction: column; align-items: center; justify-content: center; }
  #lightbox img, #lightbox video { max-width: 100%; max-height: 82vh; object-fit: contain; }
  #info { margin-top: .6rem; color: #ccc; font-size: .95rem; }
  .nav { position: fixed; top: 50%; transform: translateY(-50%); font-size: 2.4rem;
    background: none; border: none; color: #fff; cursor: pointer; padding: 1rem; z-index: 51; }
  #prec { left: 2px; }  #succ { right: 2px; }
  #chiudi { position: fixed; top: 10px; right: 14px; font-size: 1.7rem; background: none;
    border: none; color: #fff; cursor: pointer; z-index: 51; }
  .tag-versione { text-align: center; padding-bottom: 1rem; font-size: .7rem; color: #475569; }
</style>
</head>
<body>
<header>
  <h1>🖼️ Galleria live</h1>
  <p id="nome-evento">…</p>
</header>
<p id="conteggio"></p>
<div id="griglia"></div>
<p class="tag-versione">galleria · v5</p>

<div id="lightbox" onclick="chiudi()">
  <button id="chiudi">✕</button>
  <button class="nav" id="prec" onclick="event.stopPropagation(); naviga(-1)">‹</button>
  <img id="grande" src="" onclick="event.stopPropagation()">
  <video id="grande-video" controls playsinline style="display:none" onclick="event.stopPropagation()"></video>
  <div id="info" onclick="event.stopPropagation()"></div>
  <button class="nav" id="succ" onclick="event.stopPropagation(); naviga(1)">›</button>
</div>

<script>
const token = location.pathname.split('/')[2];
let foto = [], indice = 0, ultimoNumero = -1;

fetch('/api/evento/' + token).then(r => r.ok ? r.json() : null)
  .then(d => document.getElementById('nome-evento').textContent = d ? d.nome : '');

async function aggiorna() {
  try {
    foto = await (await fetch('/api/foto/' + token)).json();
    if (foto.length !== ultimoNumero) { ultimoNumero = foto.length; disegna(); }
    document.getElementById('conteggio').textContent =
      foto.length ? `${foto.length} foto e video condivisi 🎉` : 'Nessun contenuto ancora… aspetta i primi scatti!';
  } catch (e) {}
}

function disegna() {
  const g = document.getElementById('griglia');
  g.innerHTML = '';
  foto.forEach((f, i) => {
    const cella = document.createElement('div');
    cella.className = 'cella';
    if (f.tipo === 'video') {
      const v = document.createElement('video');
      v.src = f.url; v.muted = true; v.playsInline = true; v.preload = 'metadata';
      const play = document.createElement('span'); play.className = 'play'; play.textContent = '▶';
      const b = document.createElement('span'); b.className = 'badge-v'; b.textContent = '🎬 video';
      cella.append(v, play, b);
    } else {
      const img = document.createElement('img');
      img.src = f.url; img.loading = 'lazy';
      cella.append(img);
    }
    cella.onclick = () => apri(i);
    g.append(cella);
  });
}

function apri(i) { indice = i; mostra(); document.getElementById('lightbox').style.display = 'flex'; }
function chiudi() {
  document.getElementById('grande-video').pause();
  document.getElementById('lightbox').style.display = 'none';
}
function mostra() {
  const f = foto[indice];
  const im = document.getElementById('grande');
  const v = document.getElementById('grande-video');
  v.pause();
  if (f.tipo === 'video') {
    im.style.display = 'none';
    v.style.display = 'block';
    if (v.getAttribute('src') !== f.url) v.src = f.url;
  } else {
    v.style.display = 'none';
    im.style.display = 'block';
    im.src = f.url;
  }
  let quando = '';
  try { quando = new Date(f.caricata_il.replace(' ', 'T') + 'Z').toLocaleString('it-IT'); } catch (e) {}
  document.getElementById('info').textContent =
    `${f.tipo === 'video' ? '🎬' : '📸'} ${f.invitato || 'Invitato'} • ${quando}`;
}
function naviga(d) {
  if (!foto.length) return;
  indice = (indice + d + foto.length) % foto.length;
  mostra();
}
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') chiudi();
  if (e.key === 'ArrowLeft') naviga(-1);
  if (e.key === 'ArrowRight') naviga(1);
});

aggiorna();
setInterval(aggiorna, 5000);
</script>
</body>
</html>
