<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foto dell'evento</title>
<style>
  * { box-sizing: border-box; font-family: system-ui, sans-serif; }
  body { margin: 0; background: #1a1a2e; color: #fff; min-height: 100vh; }
  .contenitore { max-width: 480px; margin: 0 auto; padding: 1rem; }
  .card { background: #16213e; border-radius: 16px; padding: 1.5rem; }
  h1 { margin: 0 0 .3rem; font-size: 1.4rem; text-align: center; }
  .evento { color: #e94560; font-weight: bold; text-align: center; margin: 0 0 1rem; }
  input[type="text"] { width: 100%; padding: .7rem; border-radius: 8px; border: 1px solid #334;
    background: #0f3460; color: #fff; font-size: 1rem; margin-bottom: .7rem; }
  .riga { display: flex; gap: .6rem; }
  .bottone { flex: 1; padding: .8rem; font-size: 1rem; border: none; border-radius: 10px;
    cursor: pointer; background: #0f3460; color: #fff; }
  .bottone.principale { background: #e94560; width: 100%; flex: none;
    padding: .9rem; font-size: 1.05rem; margin-top: .7rem; }
  .bottone:disabled { opacity: .5; cursor: default; }
  #griglia { display: grid; grid-template-columns: repeat(3, 1fr); gap: .5rem; margin: .8rem 0; }
  #griglia:empty { display: none; }
  .mini { position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden; }
  .mini img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mini .elimina { position: absolute; top: 4px; right: 4px; width: 22px; height: 22px;
    border: none; border-radius: 50%; background: rgba(0,0,0,.65); color: #fff;
    font-size: .8rem; cursor: pointer; }
  #stato { text-align: center; min-height: 1.4em; margin: .5rem 0 0; font-size: .95rem; }
  .link-galleria { display: block; text-align: center; color: #7dd3fc; margin: 1rem 0 2rem; }
  /* mirino fotocamera a schermo intero */
  #camera { display: none; position: fixed; inset: 0; background: #000; z-index: 100;
    flex-direction: column; }
  #video { flex: 1; width: 100%; object-fit: contain; min-height: 0; }
  #msg-scatto { text-align: center; color: #8f8; height: 1.4em; margin: .3rem 0 0; }
  .controlli { display: flex; justify-content: space-around; align-items: center; padding: 1rem 0 1.4rem; }
  .controlli button { border: none; border-radius: 50%; cursor: pointer; }
  #scatta { width: 72px; height: 72px; background: #e94560; font-size: 1.8rem; }
  .piccolo { width: 52px; height: 52px; background: #16213e; color: #fff; font-size: 1.3rem; }
</style>
</head>
<body>
<div class="contenitore">
  <div class="card">
    <h1>📸 Condividi le tue foto</h1>
    <p class="evento" id="nome-evento">Caricamento…</p>

    <input type="text" id="nome" placeholder="Il tuo nome (facoltativo)" maxlength="50">

    <div id="griglia"></div>

    <div class="riga">
      <button class="bottone" onclick="apriCamera()">📷 Scatta una foto</button>
      <button class="bottone" onclick="document.getElementById('file').click()">🖼️ Dal telefono</button>
    </div>
    <input type="file" id="file" accept="image/*" multiple hidden>

    <button class="bottone principale" id="invia" onclick="invia()" disabled>🚀 Invia le foto</button>
    <p id="stato"></p>
  </div>
  <a class="link-galleria" id="link-galleria" href="#">🖼️ Vedi la galleria dell'evento →</a>
</div>

<!-- MIRINO FOTOCAMERA -->
<div id="camera">
  <video id="video" autoplay muted playsinline></video>
  <p id="msg-scatto"></p>
  <div class="controlli">
    <button class="piccolo" onclick="cambiaCamera()" title="Cambia fotocamera">🔄</button>
    <button id="scatta" onclick="scatta()" title="Scatta">📷</button>
    <button class="piccolo" onclick="chiudiCamera()" title="Chiudi">✕</button>
  </div>
</div>

<script>
const token = location.pathname.split('/')[2];
const stato = document.getElementById('stato');
const inAttesa = [];   // foto scattate/selezionate, non ancora inviate

document.getElementById('link-galleria').href = '/galleria/' + token;

fetch('/api/evento/' + token)
  .then(r => { if (!r.ok) throw new Error(); return r.json(); })
  .then(d => document.getElementById('nome-evento').textContent = d.nome)
  .catch(() => {});

// ---------- SELEZIONE DAL TELEFONO (multipla) ----------
document.getElementById('file').addEventListener('change', e => {
  for (const f of e.target.files) aggiungiFile(f);
  e.target.value = ''; // permette di riselezionare gli stessi file
});

function aggiungiFile(file) {
  if (!file || !file.type.startsWith('image/')) return;
  inAttesa.push(file);
  disegnaGriglia();
}

function disegnaGriglia() {
  const g = document.getElementById('griglia');
  g.innerHTML = '';
  inAttesa.forEach((file, i) => {
    const div = document.createElement('div');
    div.className = 'mini';
    const img = document.createElement('img');
    img.src = URL.createObjectURL(file);
    const x = document.createElement('button');
    x.className = 'elimina';
    x.textContent = '✕';
    x.onclick = () => { inAttesa.splice(i, 1); disegnaGriglia(); };
    div.append(img, x);
    g.append(div);
  });
  const b = document.getElementById('invia');
  b.disabled = inAttesa.length === 0;
  b.textContent = inAttesa.length ? `🚀 Invia ${inAttesa.length} foto` : '🚀 Invia le foto';
}

// ---------- FOTOCAMERA REALE (getUserMedia) ----------
let stream = null, facing = 'environment';

async function apriCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: facing, width: { ideal: 1920 }, height: { ideal: 1920 } },
      audio: false
    });
    document.getElementById('video').srcObject = stream;
    document.getElementById('camera').style.display = 'flex';
  } catch (e) {
    alert('Impossibile accedere alla fotocamera.\n\nControlla di aver dato il permesso al browser.');
  }
}

function chiudiCamera() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  document.getElementById('camera').style.display = 'none';
  document.getElementById('msg-scatto').textContent = '';
}

async function cambiaCamera() {
  facing = facing === 'environment' ? 'user' : 'environment';
  if (stream) stream.getTracks().forEach(t => t.stop());
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: facing }, audio: false });
    document.getElementById('video').srcObject = stream;
  } catch (e) { /* fotocamera assente: resta quella attuale */ }
}

function scatta() {
  const video = document.getElementById('video');
  if (!video.videoWidth) return;
  const c = document.createElement('canvas');
  c.width = video.videoWidth;
  c.height = video.videoHeight;
  c.getContext('2d').drawImage(video, 0, 0);
  c.toBlob(blob => {
    aggiungiFile(new File([blob], 'scatto.jpg', { type: 'image/jpeg' }));
    document.getElementById('msg-scatto').textContent =
      `✅ Foto aggiunta (${inAttesa.length} in totale)`;
    setTimeout(() => document.getElementById('msg-scatto').textContent = '', 1500);
  }, 'image/jpeg', 0.9);
}

// ---------- COMPRESSIONE (invii più veloci) ----------
function comprimi(file) {
  if (file.size < 300 * 1024) return Promise.resolve(file); // già piccola
  return new Promise(ok => {
    const img = new Image();
    img.onload = () => {
      const MAX = 1920;
      let w = img.naturalWidth, h = img.naturalHeight;
      if (Math.max(w, h) > MAX) {
        const s = MAX / Math.max(w, h);
        w = Math.round(w * s); h = Math.round(h * s);
      }
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      c.toBlob(b => {
        URL.revokeObjectURL(img.src);
        ok(b ? new File([b], 'foto.jpg', { type: 'image/jpeg' }) : file);
      }, 'image/jpeg', 0.85);
    };
    img.onerror = () => ok(file);
    img.src = URL.createObjectURL(file);
  });
}

// ---------- INVIO ----------
async function invia() {
  if (!inAttesa.length) return;
  const bottone = document.getElementById('invia');
  bottone.disabled = true;
  const nome = document.getElementById('nome').value.trim() || 'Invitato';
  let inviate = 0;

  for (let i = 0; i < inAttesa.length; i++) {
    stato.textContent = `📤 Invio foto ${i + 1} di ${inAttesa.length}…`;
    const file = await comprimi(inAttesa[i]);
    const dati = new FormData();
    dati.append('token', token);
    dati.append('nome', nome);
    dati.append('foto', file);
    try {
      const r = await fetch('/upload', { method: 'POST', body: dati });
      if (r.ok) inviate++;
    } catch (e) {}
  }

  stato.textContent = `✅ Grazie! Inviate ${inviate} foto su ${inAttesa.length}`;
  inAttesa.length = 0;
  disegnaGriglia();
  bottone.disabled = false;
}
</script>
</body>
</html>
